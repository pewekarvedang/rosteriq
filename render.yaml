# ==============================================================================
# RosterIQ Render Blueprint Specification
# Deploys the FastAPI + Google OR-Tools Backend and Managed Database on Render
# ==============================================================================

services:
  - type: web
    name: rosteriq-backend
    env: python
    rootDir: backend
    plan: standard
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: RosterIQ API
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "20"
      - key: DB_POOL_PRE_PING
        value: "true"
      - key: DATABASE_URL
        sync: false  # Can be mapped to Neon PostgreSQL or internal Render DB
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://rosteriq.vercel.app,https://rosteriq-app.vercel.app"

databases:
  - name: rosteriq-db
    plan: free
    region: frankfurt
    databaseName: rosteriq
    user: rosteriq_user
