<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Shield / Tile -->
  <rect width="100" height="100" rx="24" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>
  <rect x="8" y="8" width="84" height="84" rx="20" fill="url(#primaryGrad)" fill-opacity="0.15"/>
  <!-- Calendar Grid Base -->
  <rect x="22" y="26" width="56" height="52" rx="10" stroke="url(#accentGrad)" stroke-width="4" fill="#0f172a" fill-opacity="0.8"/>
  <!-- Top Bar of Calendar -->
  <path d="M22 38H78" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Calendar Pins -->
  <rect x="34" y="20" width="5" height="10" rx="2.5" fill="#38bdf8"/>
  <rect x="61" y="20" width="5" height="10" rx="2.5" fill="#38bdf8"/>
  <!-- Checkmark / Schedule Flow -->
  <path d="M38 56L46 64L64 46" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
